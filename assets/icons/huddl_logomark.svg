<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 148" fill="currentColor">
  <!-- Huddl H-mark — geometry traced from brand PNG (1024×1024 source) -->
  <!-- Two rounded-pill figures connected by a horizontal bridge, forming an H -->

  <!-- Left head -->
  <circle cx="20" cy="14" r="14"/>
  <!-- Right head -->
  <circle cx="100" cy="14" r="14"/>

  <!-- Left body: tall pill, x=0..40, y=26..148 -->
  <rect x="0" y="26" width="40" height="106" rx="20"/>
  <!-- Right body: tall pill, x=80..120, y=26..148 -->
  <rect x="80" y="26" width="40" height="106" rx="20"/>

  <!-- Bridge / crossbar: connects the two bodies at lower-middle height -->
  <!-- Vertical span ~57%–77% of total height → y=84..114 in this viewBox  -->
  <rect x="36" y="84" width="48" height="30" rx="15"/>
</svg>
