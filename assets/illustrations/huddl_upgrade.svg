  <path d="M66 144 Q100 156 134 144" stroke="#E8724A" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M118 148 Q126 164 122 176" stroke="#E8724A" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Legs -->
  <rect x="72" y="178" width="22" height="30" rx="11" fill="#2A5FBF"/>
  <rect x="106" y="178" width="22" height="30" rx="11" fill="#2A5FBF"/>
  <!-- Feet -->
  <ellipse cx="83" cy="209" rx="16" ry="9" fill="#1a1a1a"/>
  <ellipse cx="117" cy="209" rx="16" ry="9" fill="#1a1a1a"/>
