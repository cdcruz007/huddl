  <polygon points="20,14 22,22 30,22 24,27 26,35 20,30 14,35 16,27 10,22 18,22" fill="#F3C54F" opacity="0.95" transform="translate(0,-8) scale(0.9)"/>
  <!-- Right arm UP and wide -->
  <path d="M164 104 Q192 68 182 40" stroke="#3580F0" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="180" cy="34" r="14" fill="#F5E6D3"/>
  <!-- Face -->
  <circle cx="100" cy="108" r="42" fill="#F5E6D3"/>
  <!-- Joy squint eyes -->
  <path d="M82 100 Q88 94 94 100" stroke="#2c2c2c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M106 100 Q112 94 118 100" stroke="#2c2c2c" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Big open grin -->
  <path d="M82 118 Q100 136 118 118" stroke="#2c2c2c" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <!-- Teeth hint -->
  <path d="M86 121 Q100 133 114 121" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- Rosy cheeks -->
  <ellipse cx="78" cy="116" rx="11" ry="7" fill="#E8724A" opacity="0.2"/>
  <ellipse cx="122" cy="116" rx="11" ry="7" fill="#E8724A" opacity="0.2"/>
