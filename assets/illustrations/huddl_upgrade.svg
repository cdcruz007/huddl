<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Sparkle burst top-left -->
  <line x1="22" y1="22" x2="32" y2="32" stroke="#FF965C" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="32" y1="18" x2="32" y2="32" stroke="#FF965C" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="36" y1="28" x2="22" y2="28" stroke="#FF965C" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="27" cy="23" r="3" fill="#F3C54F" opacity="0.9"/>
  <!-- Sparkle burst top-right -->
  <line x1="168" y1="22" x2="178" y2="32" stroke="#F3C54F" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="178" y1="18" x2="178" y2="32" stroke="#F3C54F" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="182" y1="28" x2="168" y2="28" stroke="#F3C54F" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="173" cy="23" r="3" fill="#FF965C" opacity="0.9"/>
  <!-- Stars scattered -->
  <polygon points="52,12 54,18 60,18 55,22 57,28 52,24 47,28 49,22 44,18 50,18" fill="#F3C54F" opacity="0.85" transform="scale(0.7) translate(18,-2)"/>
  <polygon points="160,8 162,14 168,14 163,18 165,24 160,20 155,24 157,18 152,14 158,14" fill="#FF965C" opacity="0.8" transform="scale(0.6) translate(108,4)"/>
  <circle cx="100" cy="8" r="4" fill="#199A85" opacity="0.85"/>
  <!-- Shadow -->
  <ellipse cx="100" cy="228" rx="42" ry="9" fill="#3580F0" opacity="0.12"/>
  <!-- Body — slightly lifted (raised) -->
  <circle cx="100" cy="114" r="72" fill="#3580F0"/>
  <ellipse cx="78" cy="90" rx="26" ry="17" fill="#5B9DF5" opacity="0.35"/>
  <!-- Left arm UP and wide — holding star -->
  <path d="M36 104 Q8 68 18 40" stroke="#3580F0" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="20" cy="34" r="14" fill="#F5E6D3"/>
