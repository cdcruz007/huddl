<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Sound waves from megaphone -->
  <path d="M60 58 Q50 68 60 78" stroke="#FF965C" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M50 50 Q34 68 50 86" stroke="#FF965C" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M40 42 Q18 68 40 94" stroke="#FF965C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.25"/>
  <!-- Shadow -->
  <ellipse cx="100" cy="228" rx="42" ry="9" fill="#3580F0" opacity="0.12"/>
  <!-- Body -->
  <circle cx="100" cy="118" r="72" fill="#3580F0"/>
  <ellipse cx="78" cy="94" rx="26" ry="17" fill="#5B9DF5" opacity="0.35"/>
  <!-- Left arm — extended holding megaphone -->
  <path d="M36 108 Q14 88 20 64" stroke="#3580F0" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="22" cy="58" r="14" fill="#F5E6D3"/>
  <!-- Megaphone body -->
  <polygon points="68,44 68,72 82,80 82,36" fill="#FF965C" opacity="0.95"/>
  <!-- Megaphone horn -->
  <path d="M68 44 L52 30 L52 86 L68 72" fill="#E8724A" opacity="0.9"/>
  <!-- Megaphone handle -->
  <rect x="82" y="52" width="18" height="10" rx="5" fill="#FF965C" opacity="0.9"/>
  <!-- Megaphone dot detail -->
  <circle cx="90" cy="57" r="3" fill="#E8724A" opacity="0.7"/>
  <!-- Right arm — down to side -->
  <path d="M164 118 Q188 138 184 162" stroke="#3580F0" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="184" cy="168" r="14" fill="#F5E6D3"/>
  <!-- Face — slightly turned toward megaphone (tilt) -->
  <g transform="rotate(-5,100,112)">
    <circle cx="100" cy="112" r="42" fill="#F5E6D3"/>
    <!-- Enthusiastic eyes -->
    <ellipse cx="88" cy="104" rx="6.5" ry="7" fill="#2c2c2c"/>
    <ellipse cx="114" cy="104" rx="6.5" ry="7" fill="#2c2c2c"/>
    <circle cx="91" cy="101" r="2.5" fill="white"/>
    <circle cx="117" cy="101" r="2.5" fill="white"/>
    <!-- Wide open excited smile -->
    <path d="M84 122 Q100 136 116 122" stroke="#2c2c2c" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <!-- Open mouth hint -->
    <ellipse cx="100" cy="126" rx="10" ry="6" fill="#c0907a" opacity="0.6"/>
    <!-- Rosy cheeks -->
    <ellipse cx="78" cy="116" rx="10" ry="7" fill="#E8724A" opacity="0.18"/>
    <ellipse cx="120" cy="116" rx="10" ry="7" fill="#E8724A" opacity="0.18"/>
  </g>
  <!-- Scarf -->
  <path d="M66 148 Q100 160 134 148" stroke="#E8724A" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M118 152 Q126 168 122 180" stroke="#E8724A" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Legs -->
  <rect x="72" y="182" width="22" height="30" rx="11" fill="#2A5FBF"/>
  <rect x="106" y="182" width="22" height="30" rx="11" fill="#2A5FBF"/>
  <!-- Feet -->
  <ellipse cx="83" cy="213" rx="16" ry="9" fill="#1a1a1a"/>
  <ellipse cx="117" cy="213" rx="16" ry="9" fill="#1a1a1a"/>
</svg>
