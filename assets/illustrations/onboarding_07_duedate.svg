<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
  <!-- Location pin / sparkle backdrop -->
  <ellipse cx="160" cy="80" rx="70" ry="80" fill="#FFF0EB"/>
  <path d="M130 148 Q160 190 160 190 Q160 190 190 148" fill="#FFF0EB"/>
  <!-- Sparkle stars inside pin -->
  <path d="M160 40 L163 52 L175 52 L166 60 L169 72 L160 64 L151 72 L154 60 L145 52 L157 52 Z" fill="#E8724A" opacity="0.3"/>
  <circle cx="140" cy="68" r="4" fill="#E8724A" opacity="0.2"/>
  <circle cx="180" cy="62" r="3" fill="#3580F0" opacity="0.25"/>

  <!-- Parent character — larger, holding baby -->
  <g transform="translate(175,130)">
    <ellipse cx="0" cy="102" rx="44" ry="9" fill="#3580F0" opacity="0.1"/>
    <!-- Body -->
    <circle cx="0" cy="20" r="58" fill="#3580F0"/>
    <ellipse cx="-16" cy="-4" rx="22" ry="14" fill="#5B9DF5" opacity="0.35"/>
    <!-- Left arm cradling baby -->
    <path d="M-44 20 Q-62 40 -54 62" stroke="#3580F0" stroke-width="20" stroke-linecap="round" fill="none"/>
    <circle cx="-52" cy="68" r="14" fill="#F5E6D3"/>
    <!-- Right arm cradling baby -->
    <path d="M44 20 Q56 40 48 58" stroke="#3580F0" stroke-width="20" stroke-linecap="round" fill="none"/>
    <circle cx="46" cy="64" r="14" fill="#F5E6D3"/>
    <!-- Face -->
    <circle cx="0" cy="14" r="36" fill="#F5E6D3"/>
    <!-- Soft loving eyes — slightly closed -->
    <path d="M-13 6 Q-9 1 -5 6" stroke="#2c2c2c" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M5 6 Q9 1 13 6" stroke="#2c2c2c" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <!-- Warm gentle smile -->
    <path d="M-11 22 Q0 32 11 22" stroke="#2c2c2c" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <!-- Rosy cheeks -->
    <ellipse cx="-22" cy="18" rx="9" ry="6" fill="#E8724A" opacity="0.2"/>
    <ellipse cx="22" cy="18" rx="9" ry="6" fill="#E8724A" opacity="0.2"/>
    <!-- Scarf -->
    <path d="M-22 58 Q0 68 22 58" stroke="#E8724A" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M13 62 Q18 74 15 86" stroke="#E8724A" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Baby being cradled -->
    <circle cx="0" cy="72" r="22" fill="#3580F0" opacity="0.7"/>
    <circle cx="0" cy="68" r="16" fill="#F5E6D3"/>
    <!-- Tiny baby face -->
    <ellipse cx="-4" cy="64" rx="2.5" ry="3" fill="#2c2c2c"/>
    <ellipse cx="4" cy="64" rx="2.5" ry="3" fill="#2c2c2c"/>
    <path d="M-3 72 Q0 76 3 72" stroke="#2c2c2c" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Baby blanket/wrap -->
    <path d="M-20 78 Q0 88 20 78" stroke="#3580F0" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.7"/>
    <!-- Legs -->
    <rect x="-19" y="76" width="16" height="26" rx="8" fill="#2A5FBF"/>
    <rect x="3" y="76" width="16" height="26" rx="8" fill="#2A5FBF"/>
    <ellipse cx="-11" cy="103" rx="13" ry="7" fill="#1a1a1a"/>
    <ellipse cx="11" cy="103" rx="13" ry="7" fill="#1a1a1a"/>
  </g>
</svg>
