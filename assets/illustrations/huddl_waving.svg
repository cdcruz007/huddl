<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Wave motion lines -->
  <path d="M162 38 Q172 28 162 18" stroke="#3580F0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.45"/>
  <path d="M174 48 Q186 36 176 24" stroke="#3580F0" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.3"/>
  <!-- Shadow -->
  <ellipse cx="100" cy="228" rx="42" ry="9" fill="#3580F0" opacity="0.12"/>
  <!-- Body -->
  <circle cx="100" cy="118" r="72" fill="#3580F0"/>
  <ellipse cx="78" cy="94" rx="26" ry="17" fill="#5B9DF5" opacity="0.35"/>
  <!-- Left arm relaxed down -->
  <path d="M36 118 Q10 136 14 162" stroke="#3580F0" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="14" cy="168" r="14" fill="#F5E6D3"/>
  <!-- Right arm WAVING high -->
  <path d="M164 104 Q188 62 168 36" stroke="#3580F0" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="164" cy="28" r="14" fill="#F5E6D3"/>
  <!-- Face -->
  <circle cx="100" cy="112" r="42" fill="#F5E6D3"/>
  <!-- Bright friendly eyes -->
  <ellipse cx="86" cy="104" rx="6.5" ry="7" fill="#2c2c2c"/>
  <ellipse cx="114" cy="104" rx="6.5" ry="7" fill="#2c2c2c"/>
  <circle cx="89" cy="101" r="2.5" fill="white"/>
  <circle cx="117" cy="101" r="2.5" fill="white"/>
  <!-- Big warm smile -->
  <path d="M84 122 Q100 136 116 122" stroke="#2c2c2c" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <!-- Rosy cheeks -->
  <ellipse cx="78" cy="118" rx="10" ry="7" fill="#E8724A" opacity="0.18"/>
  <ellipse cx="122" cy="118" rx="10" ry="7" fill="#E8724A" opacity="0.18"/>
  <!-- Scarf -->
  <path d="M66 148 Q100 160 134 148" stroke="#E8724A" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M118 152 Q126 168 122 180" stroke="#E8724A" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Legs -->
  <rect x="72" y="182" width="22" height="30" rx="11" fill="#2A5FBF"/>
  <rect x="106" y="182" width="22" height="30" rx="11" fill="#2A5FBF"/>
  <!-- Feet -->
  <ellipse cx="83" cy="213" rx="16" ry="9" fill="#1a1a1a"/>
  <ellipse cx="117" cy="213" rx="16" ry="9" fill="#1a1a1a"/>
</svg>
