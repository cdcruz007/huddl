<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Shadow -->
  <ellipse cx="100" cy="228" rx="42" ry="9" fill="#3580F0" opacity="0.12"/>
  <!-- Body -->
  <circle cx="100" cy="118" r="72" fill="#3580F0"/>
  <!-- Body sheen -->
  <ellipse cx="78" cy="94" rx="26" ry="17" fill="#5B9DF5" opacity="0.35"/>
  <!-- Left arm — raised, holding lock -->
  <path d="M36 108 Q18 78 28 52" stroke="#3580F0" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="30" cy="46" r="14" fill="#F5E6D3"/>
  <!-- Right arm — down to side -->
  <path d="M164 118 Q188 138 184 162" stroke="#3580F0" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="184" cy="168" r="14" fill="#F5E6D3"/>
  <!-- Lock icon (held in left hand area) -->
  <rect x="14" y="14" width="32" height="24" rx="5" fill="#FF965C"/>
  <rect x="18" y="22" width="24" height="18" rx="3" fill="#FF965C"/>
  <path d="M22 22 Q22 10 30 10 Q38 10 38 22" stroke="#E87040" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="30" cy="31" r="4" fill="white" opacity="0.9"/>
  <rect x="28.5" y="31" width="3" height="5" rx="1.5" fill="white" opacity="0.9"/>
  <!-- Face -->
  <circle cx="100" cy="112" r="42" fill="#F5E6D3"/>
  <!-- Slightly worried / serious eyes -->
  <ellipse cx="86" cy="104" rx="6" ry="7" fill="#2c2c2c"/>
  <ellipse cx="114" cy="104" rx="6" ry="7" fill="#2c2c2c"/>
  <circle cx="89" cy="101" r="2.5" fill="white"/>
  <circle cx="117" cy="101" r="2.5" fill="white"/>
  <!-- Furrowed left brow -->
  <path d="M80 96 Q87 92 94 95" stroke="#2c2c2c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Furrowed right brow -->
  <path d="M106 95 Q113 92 120 96" stroke="#2c2c2c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Flat / unsure mouth -->
  <path d="M88 124 Q100 127 112 124" stroke="#2c2c2c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Scarf -->
  <path d="M66 148 Q100 160 134 148" stroke="#E8724A" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M118 152 Q126 168 122 180" stroke="#E8724A" stroke-width="9" stroke-linecap="round" fill="none"/>
  <!-- Legs -->
  <rect x="72" y="182" width="22" height="30" rx="11" fill="#2A5FBF"/>
  <rect x="106" y="182" width="22" height="30" rx="11" fill="#2A5FBF"/>
  <!-- Feet -->
  <ellipse cx="83" cy="213" rx="16" ry="9" fill="#1a1a1a"/>
  <ellipse cx="117" cy="213" rx="16" ry="9" fill="#1a1a1a"/>
</svg>
