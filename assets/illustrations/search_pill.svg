<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 56" width="340" height="56">
  <!-- Pill search bar — white, heavy shadow, full-width -->
  <!-- Shadow layers -->
  <rect x="8" y="10" width="324" height="44" rx="22" fill="#000000" opacity="0.04"/>
  <rect x="4" y="6" width="332" height="44" rx="22" fill="#000000" opacity="0.06"/>
  <!-- Main pill -->
  <rect x="0" y="0" width="340" height="48" rx="24" fill="#FFFFFF"/>
  <rect x="0" y="0" width="340" height="48" rx="24" fill="none" stroke="#E8E8E8" stroke-width="1"/>
  <!-- Search icon -->
  <circle cx="34" cy="24" r="8" fill="none" stroke="#262A35" stroke-width="2" stroke-linecap="round"/>
  <line x1="39.5" y1="29.5" x2="44" y2="34" stroke="#262A35" stroke-width="2" stroke-linecap="round"/>
  <!-- Divider -->
  <line x1="58" y1="14" x2="58" y2="34" stroke="#E8E8E8" stroke-width="1"/>
  <!-- Placeholder text — location dot -->
  <circle cx="72" cy="24" r="3" fill="#FF965C"/>
  <!-- "Find parents near you..." text representation -->
  <rect x="82" y="20" width="140" height="8" rx="4" fill="#D4D4D4" opacity="0.6"/>
  <!-- Filter icon right -->
  <circle cx="308" cy="24" r="18" fill="#262A35"/>
  <line x1="302" y1="20" x2="314" y2="20" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="304" y1="24" x2="312" y2="24" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="306" y1="28" x2="310" y2="28" stroke="white" stroke-width="1" stroke-linecap="round"/>
</svg>
