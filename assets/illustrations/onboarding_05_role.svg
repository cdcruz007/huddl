<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">
  <!-- House/building backdrop panels -->
  <rect x="30" y="20" width="90" height="120" rx="8" fill="#FFF0EB"/>
