  <circle cx="52" cy="24" r="7" fill="white" opacity="0.9"/>
  <circle cx="62" cy="20" r="9" fill="white" opacity="0.9"/>
  <circle cx="74" cy="24" r="7" fill="white" opacity="0.9"/>

  <rect x="150" y="10" width="100" height="130" rx="8" fill="#E6F0FE"/>
  <rect x="165" y="28" width="20" height="20" rx="2" fill="#3580F0" opacity="0.2"/>
  <rect x="192" y="28" width="20" height="20" rx="2" fill="#3580F0" opacity="0.2"/>
  <rect x="165" y="56" width="20" height="20" rx="2" fill="#3580F0" opacity="0.2"/>
  <rect x="192" y="56" width="20" height="20" rx="2" fill="#3580F0" opacity="0.2"/>
  <circle cx="168" cy="14" r="7" fill="white" opacity="0.9"/>
  <circle cx="180" cy="10" r="9" fill="white" opacity="0.9"/>
  <circle cx="194" cy="14" r="7" fill="white" opacity="0.9"/>

  <rect x="268" y="30" width="78" height="110" rx="8" fill="#FFF0EB"/>
  <rect x="280" y="44" width="16" height="16" rx="2" fill="#E8724A" opacity="0.25"/>
  <rect x="302" y="44" width="16" height="16" rx="2" fill="#E8724A" opacity="0.25"/>
  <circle cx="284" cy="34" r="6" fill="white" opacity="0.9"/>
  <circle cx="296" cy="30" r="7" fill="white" opacity="0.9"/>
  <circle cx="308" cy="34" r="6" fill="white" opacity="0.9"/>

  <!-- Character 1 — left, stepping toward right -->
  <g transform="translate(128,148)">
    <ellipse cx="0" cy="64" rx="32" ry="7" fill="#3580F0" opacity="0.1"/>
    <circle cx="0" cy="0" r="44" fill="#3580F0"/>
    <ellipse cx="-12" cy="-20" rx="16" ry="10" fill="#5B9DF5" opacity="0.35"/>
    <path d="M-34 -4 Q-56 12 -52 32" stroke="#3580F0" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="-52" cy="38" r="11" fill="#F5E6D3"/>
    <!-- hand reaching right toward char 2 -->
    <path d="M34 -4 Q60 -4 68 6" stroke="#3580F0" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="71" cy="10" r="11" fill="#F5E6D3"/>
    <circle cx="0" cy="-4" r="28" fill="#F5E6D3"/>
    <ellipse cx="-9" cy="-10" rx="4.5" ry="5.5" fill="#2c2c2c"/>
    <ellipse cx="9" cy="-10" rx="4.5" ry="5.5" fill="#2c2c2c"/>
    <circle cx="-7" cy="-12" r="1.8" fill="white"/>
    <circle cx="11" cy="-12" r="1.8" fill="white"/>
    <path d="M-8 4 Q0 12 8 4" stroke="#2c2c2c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-16 22 Q0 30 16 22" stroke="#E8724A" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M9 25 Q13 34 11 43" stroke="#E8724A" stroke-width="6" stroke-linecap="round" fill="none"/>
    <rect x="-14" y="34" width="12" height="20" rx="6" fill="#2A5FBF"/>
