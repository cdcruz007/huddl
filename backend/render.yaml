services:
  - type: web
    name: huddl-connect-backend
    env: node
    region: frankfurt  # Closest to UK users
    plan: starter
    buildCommand: npm install --production
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── Add these in Render dashboard (Settings → Environment) ──
      # STRIPE_SECRET_KEY            → sk_live_51J29Cx...
      # STRIPE_PUBLISHABLE_KEY       → pk_live_51J29Cx...
      # STRIPE_WEBHOOK_SECRET        → whsec_NrvFWpNM...
      # STRIPE_PRICE_PLUS_MONTHLY=price_1TaagGGb8Lg9FVI5f2SrV5nv
      # STRIPE_PRICE_PLUS_ANNUAL=price_1TaagHGb8Lg9FVI5k1BKNlqv
      # STRIPE_PRICE_PARTNER_MONTHLY=price_1TaagHGb8Lg9FVI5bgzTWFLU
      # STRIPE_PRICE_PARTNER_ANNUAL=price_1TaagIGb8Lg9FVI54eBr0Qgo
      # FIREBASE_PROJECT_ID              → huddl-connect
      # SMTP_HOST                        → smtp.hostinger.com
      # SMTP_PORT                        → 465
      # SMTP_USER                        → hello@huddlapp.co.uk
      # SMTP_PASS                        → YOUR_HOSTINGER_EMAIL_PASSWORD
      # JWT_SECRET                       → (random 64-char string)
      # FRONTEND_URL                     → https://huddlapp.co.uk
