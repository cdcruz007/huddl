name: huddl_connect
description: Huddl - Connect with your community through groups, meetups and marketplace.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: 6.1.5+1
  shared_preferences: 2.5.3
  http: 1.5.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  url_launcher: ^6.2.5

  # Firebase (LOCKED versions — tested with Flutter 3.35.4)
  firebase_core: 3.6.0
  firebase_auth: 5.3.1
  cloud_firestore: 5.4.3
  firebase_storage: 12.3.2
  firebase_messaging: 15.1.3

  # Payment / In-App Purchases
  in_app_purchase: 3.2.0           # Apple StoreKit + Google Play Billing (official Flutter plugin)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/illustrations/
    - assets/icons/
    - assets/images/avatars/
    - assets/images/groups/
